<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🧪 STAGING · Copihue · Gastos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--vd:#1b5e20;--vdp:#0a3d0f;--verde:#2e7d32;--vl:#e8f5e9;--bg:#f1f8f1;--borde:#c8e6c9;--texto:#1a2e1c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--texto);min-height:100dvh}
.hdr{background:linear-gradient(135deg,var(--vdp),var(--vd),var(--verde));padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(10,61,15,.4)}
.hdr-icon{font-size:1.5rem}.hdr-t{color:#fff;font-size:.95rem;font-weight:900}
.hdr-s{color:rgba(255,255,255,.7);font-size:.62rem;letter-spacing:2px;text-transform:uppercase}
.btn-back{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:5px 13px;font-size:.76rem;font-weight:700;text-decoration:none}
.card{margin:12px;background:#fff;border-radius:18px;border:1px solid var(--borde);overflow:hidden;box-shadow:0 1px 6px rgba(46,125,50,.08);max-width:560px}
@media(min-width:600px){.card{margin:12px auto}}
.card-t{background:linear-gradient(90deg,var(--vdp),var(--vd));color:#fff;padding:10px 16px;font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.card-b{padding:14px}
.nota{font-size:.78rem;color:#666;margin-bottom:10px}
select{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:12px;font-size:1rem;font-family:inherit;margin-bottom:10px;background:#fff}
</style>
</head>
<body>
<div style="background:#ff9800;color:#000;text-align:center;font-weight:900;font-size:.75rem;padding:4px">🧪 STAGING — datos de prueba</div>
<div class="hdr">
  <div class="hdr-icon">💸</div>
  <div><div class="hdr-t">Copihue</div><div class="hdr-s">Gastos</div></div>
  <a href="seba21.html" class="btn-back">← Volver</a>
</div>
<div class="card">
  <div class="card-t">📊 Salidas de dinero del mes</div>
  <div class="card-b">
    <div class="nota">Retiros y gastos registrados en caja (EGRESOS). No incluye mercadería de merma/consumo.</div>
    <select id="salMes" onchange="_salReset()"></select>
    <div id="salEstado" style="min-height:20px;font-size:.85rem;margin-bottom:10px;color:#444"></div>
    <button id="salBtnGen" onclick="generarSalidasExcel()" style="width:100%;padding:13px;background:#e65100;border:none;border-radius:14px;color:#fff;font-weight:900;font-size:.95rem;cursor:pointer;font-family:inherit">Generar Excel</button>
    <div id="salAcciones" style="display:none;gap:8px;margin-top:8px"></div>
    <div id="salResumen" style="margin-top:14px"></div>
  </div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzQccLKYVVhdCGzX8_SKd59rcifTTm_Ciuu0MPDVNBNEtDhG0LOB7WylhYVMSFAypB9pg/exec';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
// ====== EXCEL DE SALIDAS DE DINERO ======
// Solo LEE (getCajaEgresos). No escribe nada en las hojas.
const _SAL_PERSONALES=['RETIRO DUENO','FAMILIA','PERSONAL','FAMILIA CHILE'];
let _salArchivo=null; // {blob,nombre}
const _salNormCat=c=>{
  const t=(c||'').toString().replace(/\s+/g,' ').trim().toUpperCase();
  return t||'SIN CATEGORÍA';
};
const _salEsPersonal=c=>_SAL_PERSONALES.indexOf(c.normalize('NFD').replace(/[̀-ͯ]/g,''))>=0;
const _salMedio=m=>{const t=(m||'').toString().replace(/\s+/g,' ').trim().toUpperCase();return t||'SIN DATO';};
function _salOpcionesMeses(){
  const o=[];const h=new Date();
  for(let k=0;k<24;k++){
    const d=new Date(h.getFullYear(),h.getMonth()-k,1);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    o.push('<option value="'+v+'">'+MESES[d.getMonth()]+' '+d.getFullYear()+'</option>');
  }
  return o.join('');
}
function _salReset(){
  const rs=document.getElementById('salResumen');if(rs)rs.innerHTML='';
  _salArchivo=null;
  const a=document.getElementById('salAcciones');if(a){a.style.display='none';a.innerHTML='';}
  const e=document.getElementById('salEstado');if(e)e.textContent='';
}
async function _salTraer(){
  const url=API_URL+'?action=getCajaEgresos&data='+encodeURIComponent(JSON.stringify({limite:20000}))+'&t='+Date.now();
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),30000);
  try{
    const r=await fetch(url,{signal:ctl.signal});
    const j=await r.json();
    if(!j||j.ok!==true||!Array.isArray(j.registros)) throw new Error((j&&j.error)||'Respuesta inesperada del servidor');
    return j.registros;
  }finally{clearTimeout(to);}
}
function _salConstruirWb(regs,mesKey){
  const [Y,M]=mesKey.split('-').map(Number);
  const etiqueta=MESES[M-1]+' '+Y;
  const rows=regs.slice().sort((a,b)=>(a.fecha+' '+a.hora)<(b.fecha+' '+b.hora)?-1:1)
    .map(r=>({fecha:r.fecha,hora:r.hora||'',motivo:r.motivo||'',cat:_salNormCat(r.categoria),medio:_salMedio(r.medio),monto:Math.round((parseFloat(r.monto)||0)*100)/100,obs:r.obs||''}));
  const N=rows.length;
  const totalGeneral=rows.reduce((a,r)=>a+r.monto,0);
  const wb=XLSX.utils.book_new();
  const num=(v,f)=>{const c={t:'n',v:v,z:'#,##0'};if(f)c.f=f;return c;};
  // Hoja Detalle: fila1 título, fila2 vacía, fila3 encabezados, datos desde fila 4
  const det=[['SALIDAS DE DINERO — '+etiqueta.toUpperCase()],[],['Fecha','Hora','Motivo','Categoría','Medio de pago','Monto $','Observación']];
  rows.forEach(r=>det.push([r.fecha,r.hora,r.motivo,r.cat,r.medio,num(r.monto),r.obs]));
  const i1=4,iN=3+N;
  det.push([]);
  det.push(['TOTAL','','','','',num(totalGeneral,N?('SUM(F'+i1+':F'+iN+')'):null),'']);
  const wsD=XLSX.utils.aoa_to_sheet(det);
  wsD['!cols']=[{wch:12},{wch:8},{wch:34},{wch:20},{wch:16},{wch:14},{wch:34}];
  XLSX.utils.book_append_sheet(wb,wsD,'Detalle');
  const rngCat=N?'Detalle!$D$'+i1+':$D$'+iN:null, rngMed=N?'Detalle!$E$'+i1+':$E$'+iN:null, rngMon=N?'Detalle!$F$'+i1+':$F$'+iN:null;
  const agrupar=k=>{const m={};rows.forEach(r=>{const x=m[r[k]]||(m[r[k]]={n:0,t:0});x.n++;x.t+=r.monto;});return m;};
  // Hoja Por categoría
  const mc=agrupar('cat');
  const cats=Object.keys(mc);
  const negocio=cats.filter(c=>!_salEsPersonal(c)).sort((a,b)=>mc[b].t-mc[a].t);
  const personal=cats.filter(c=>_salEsPersonal(c)).sort((a,b)=>mc[b].t-mc[a].t);
  const cat=[['SALIDAS POR CATEGORÍA — '+etiqueta.toUpperCase()],[],['Categoría','Cantidad','Total $','% del total']];
  let fila=4;
  const filasGrupo=(lista)=>{
    const ini=fila;
    lista.forEach(c=>{
      cat.push([c,{t:'n',v:mc[c].n,f:'COUNTIF('+rngCat+',A'+fila+')'},num(mc[c].t,'SUMIF('+rngCat+',A'+fila+','+rngMon+')'),{t:'n',v:totalGeneral?mc[c].t/totalGeneral:0,z:'0.0%',f:'IF($C$__TOT__=0,0,C'+fila+'/$C$__TOT__)'}]);
      fila++;
    });
    return [ini,fila-1];
  };
  cat.push(['GASTOS DEL NEGOCIO','','','']);fila++;
  const [n1,n2]=filasGrupo(negocio);
  const subN=negocio.reduce((a,c)=>a+mc[c].t,0), cntN=negocio.reduce((a,c)=>a+mc[c].n,0);
  const filaSubN=fila;
  cat.push(['Subtotal negocio',{t:'n',v:cntN,f:negocio.length?'SUM(B'+n1+':B'+n2+')':null},num(subN,negocio.length?'SUM(C'+n1+':C'+n2+')':null),{t:'n',v:totalGeneral?subN/totalGeneral:0,z:'0.0%',f:'IF($C$__TOT__=0,0,C'+filaSubN+'/$C$__TOT__)'}]);fila++;
  cat.push([]);fila++;
  cat.push(['RETIROS PERSONALES / FAMILIA','','','']);fila++;
  const [p1,p2]=filasGrupo(personal);
  const subP=personal.reduce((a,c)=>a+mc[c].t,0), cntP=personal.reduce((a,c)=>a+mc[c].n,0);
  const filaSubP=fila;
  cat.push(['Subtotal personal / familia',{t:'n',v:cntP,f:personal.length?'SUM(B'+p1+':B'+p2+')':null},num(subP,personal.length?'SUM(C'+p1+':C'+p2+')':null),{t:'n',v:totalGeneral?subP/totalGeneral:0,z:'0.0%',f:'IF($C$__TOT__=0,0,C'+filaSubP+'/$C$__TOT__)'}]);fila++;
  cat.push([]);fila++;
  const filaTot=fila;
  cat.push(['TOTAL GENERAL',{t:'n',v:cntN+cntP,f:'B'+filaSubN+'+B'+filaSubP},num(totalGeneral,'C'+filaSubN+'+C'+filaSubP),'']);
  cat.forEach(r=>r.forEach((c,i)=>{if(c&&c.f)c.f=c.f.replace(/__TOT__/g,String(filaTot));}));
  // quitar f null
  cat.forEach(r=>r.forEach((c,i)=>{if(c&&typeof c==='object'&&c.f===null)delete c.f;}));
  const wsC=XLSX.utils.aoa_to_sheet(cat);
  wsC['!cols']=[{wch:32},{wch:10},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb,wsC,'Por categoría');
  // Hoja Por medio de pago
  const mm=agrupar('medio');
  const meds=Object.keys(mm).sort((a,b)=>mm[b].t-mm[a].t);
  const med=[['SALIDAS POR MEDIO DE PAGO — '+etiqueta.toUpperCase()],[],['Medio de pago','Cantidad','Total $','% del total']];
  meds.forEach((m,i)=>{const fr=4+i;med.push([m,{t:'n',v:mm[m].n,f:'COUNTIF('+rngMed+',A'+fr+')'},num(mm[m].t,'SUMIF('+rngMed+',A'+fr+','+rngMon+')'),{t:'n',v:totalGeneral?mm[m].t/totalGeneral:0,z:'0.0%',f:'IF($C$'+(4+meds.length)+'=0,0,C'+fr+'/$C$'+(4+meds.length)+')'}]);});
  med.push(['TOTAL',meds.length?{t:'n',v:N,f:'SUM(B4:B'+(3+meds.length)+')'}:{t:'n',v:0},num(totalGeneral,meds.length?'SUM(C4:C'+(3+meds.length)+')':null),'']);
  med.forEach(r=>r.forEach(c=>{if(c&&typeof c==='object'&&c.f===null)delete c.f;}));
  const wsM=XLSX.utils.aoa_to_sheet(med);
  wsM['!cols']=[{wch:24},{wch:10},{wch:16},{wch:12}];
  XLSX.utils.book_append_sheet(wb,wsM,'Por medio de pago');
  return {wb,N,total:totalGeneral,etiqueta};
}
async function generarSalidasExcel(){
  const sel=document.getElementById('salMes');if(!sel) return;
  const mesKey=sel.value;
  const est=document.getElementById('salEstado'),btn=document.getElementById('salBtnGen');
  _salReset();
  btn.disabled=true;btn.textContent='⏳ Trayendo datos…';
  try{
    if(typeof XLSX==='undefined') throw new Error('No cargó la librería de Excel. Revisá la conexión y recargá.');
    const todos=await _salTraer();
    const delMes=todos.filter(r=>r.fecha&&r.fecha.startsWith(mesKey));
    if(!delMes.length){est.innerHTML='<span style="color:#c62828">No hay salidas de dinero registradas en ese mes.</span>';return;}
    const {wb,N,total,etiqueta}=_salConstruirWb(delMes,mesKey);
    const nombre='salidas-'+mesKey+'.xlsx';
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    _salArchivo={blob,nombre};
    est.innerHTML='<b>'+etiqueta+'</b>: '+N+' salidas · total <b>$'+Math.round(total).toLocaleString('es-AR')+'</b>';
    _salPreview(delMes);
    const acc=document.getElementById('salAcciones');
    let h='<button onclick="_salDescargar()" style="flex:1;padding:12px;background:#1b5e20;border:none;border-radius:14px;color:#fff;font-weight:900;font-size:.88rem;cursor:pointer;font-family:inherit">⬇️ Descargar</button>';
    try{
      const f=new File([blob],nombre,{type:blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})) h+='<button onclick="_salCompartir()" style="flex:1;padding:12px;background:#1565c0;border:none;border-radius:14px;color:#fff;font-weight:900;font-size:.88rem;cursor:pointer;font-family:inherit">📤 Compartir</button>';
    }catch(e){}
    acc.innerHTML=h;acc.style.display='flex';
  }catch(e){
    est.innerHTML='<span style="color:#c62828">❌ No se pudo generar: '+String((e&&e.name==='AbortError')?'el servidor tardó demasiado':(e&&e.message)||e)+'</span>';
  }finally{btn.disabled=false;btn.textContent='Generar Excel';}
}
function _salDescargar(){
  if(!_salArchivo) return;
  const a=document.createElement('a');a.href=URL.createObjectURL(_salArchivo.blob);a.download=_salArchivo.nombre;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function _salCompartir(){
  if(!_salArchivo) return;
  try{
    const f=new File([_salArchivo.blob],_salArchivo.nombre,{type:_salArchivo.blob.type});
    await navigator.share({files:[f],title:'Salidas de dinero '+_salArchivo.nombre});
  }catch(e){ if(e&&e.name!=='AbortError') _salDescargar(); }
}

function _salPreview(regs){
  const el=document.getElementById('salResumen');if(!el) return;
  const m={};regs.forEach(r=>{const c=_salNormCat(r.categoria);m[c]=(m[c]||0)+(parseFloat(r.monto)||0);});
  const tot=Object.values(m).reduce((a,b)=>a+b,0)||1;
  el.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([c,v])=>
    '<div style="display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #e8f5e9;font-size:.84rem"><span>'+(_salEsPersonal(c)?'👤 ':'🏪 ')+c.replace(/</g,'&lt;')+'</span><b>$'+Math.round(v).toLocaleString('es-AR')+' <span style="color:#777;font-weight:400">· '+Math.round(v/tot*100)+'%</span></b></div>').join('')+
    '<div style="font-size:.7rem;color:#777;margin-top:6px">🏪 negocio · 👤 personal / familia</div>';
}

function _salOpcionesMeses2(){document.getElementById('salMes').innerHTML=_salOpcionesMeses();}
_salOpcionesMeses2();
</script>
</body>
</html>
