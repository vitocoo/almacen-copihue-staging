<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/png" href="favicon-48.png"><!-- logo nuevo VAO -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>[STAGING] VAO Sistemas · SmartPOS</title>
<link rel="icon" type="image/svg+xml" href="VA_logo_vector_master.svg">
<style>
  :root{
    --bg: #141A22;
    --panel: #1B2431;
    --panel-border: #2A3542;
    --text: #eef2f0;
    --muted: #90A0AF;
    --accent: #FF9800;
    --green: #2CCB6F;
    --green-hover: #34e07d;
    --green-active: #23b25e;
    --blue: #0078FF;
    --error: #e2665a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(0,120,255,0.10), transparent 55%),
      linear-gradient(180deg, #141A22 0%, #10151b 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }

  .stage{
    width:100%;
    max-width: 360px;
  }

  .mark{
    display:flex;
    justify-content:center;
    margin-bottom: 20px;
  }

  .mark svg{
    height: 64px;
    width: auto;
    max-width: 100%;
  }

  .brand{
    text-align:center;
    margin-bottom: 32px;
  }

  .brand .company{
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin: 0 0 8px 0;
    text-transform: uppercase;
  }

  .brand .tagline{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px 0;
    line-height: 1.4;
  }

  .brand .product{
    font-size: 12px;
    color: var(--muted);
    margin: 0;
    opacity: 0.8;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-top: 2px solid var(--accent);
    border-radius: 10px;
    padding: 28px 22px 24px 22px;
  }

  label{
    display:block;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  input#codigo{
    width:100%;
    font-size: 22px;
    letter-spacing: 0.12em;
    text-align:center;
    text-transform: uppercase;
    background: #10151b;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    padding: 16px 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input#codigo::placeholder{
    text-transform: none;
    letter-spacing: normal;
    font-size: 15px;
    color: #5c6b78;
  }

  input#codigo:focus{
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,120,255,0.20);
  }

  input#codigo.invalid{
    border-color: var(--error);
  }

  .error-slot{
    min-height: 20px;
    margin-top: 10px;
  }

  .error-slot p{
    margin:0;
    font-size: 13px;
    color: var(--error);
  }

  button#entrar{
    width:100%;
    margin-top: 18px;
    padding: 15px 12px;
    font-size: 16px;
    font-weight: 600;
    color: #0c1a12;
    background: var(--green);
    border: none;
    border-radius: 8px;
    cursor:pointer;
    transition: background-color 0.15s ease, transform 0.05s ease;
  }

  button#entrar:hover{ background: var(--green-hover); }
  button#entrar:active{ background: var(--green-active); transform: translateY(1px); }

  button#entrar:focus-visible,
  a.admin-link:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }

  .admin-row{
    text-align:center;
    margin-top: 26px;
  }

  .admin-row span{
    color: var(--muted);
    font-size: 13px;
  }

  a.admin-link{
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  a.admin-link:hover{ color: var(--text); }

  .version-tag{
    position: fixed;
    right: 10px;
    bottom: 8px;
    font-size: 11px;
    color: #3a4652;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>
<!-- STAGING-ONLY:INICIO -->
<style>
@keyframes vaoStgPulso {
    0%, 94%, 100% { transform: scale(1); }
    96% { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(255,120,0,.35); }
    98% { transform: scale(1); }
}
#vaoStagingBadge { animation: vaoStgPulso 30s ease-in-out infinite; transform-origin: left bottom; }
@media (prefers-reduced-motion: reduce) { #vaoStagingBadge { animation: none; } }
</style>
<div id="vaoStagingBadge" style="position:fixed;left:6px;bottom:6px;z-index:99999;padding:3px 8px;border-radius:10px;background:rgba(255,120,0,0.88);color:#fff;font:600 11px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.25);">🧪 STAGING · sistema de pruebas</div>
<!-- STAGING-ONLY:FIN -->

  <div class="stage">
    <div class="mark">
      <img src="logo_oscuro.png" alt="VAO Sistemas" height="64" style="height:64px;width:auto;display:block;">
    </div>

    <div class="brand">
      <p class="company">VAO Sistemas</p>
      <p class="tagline">Ver más lejos. Avanzar mejor. Crear el futuro.</p>
      <p class="product">SmartPOS</p>
    </div>

    <div class="panel">
      <form id="form-entrada" novalidate>
        <label for="codigo">Ingresá tu código de cliente (ej: XX)</label>
        <input
          type="text"
          id="codigo"
          name="codigo"
          maxlength="3"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          inputmode="text"
          placeholder="XX"
        >
        <div class="error-slot" aria-live="polite">
          <p id="error-msg" hidden>Código inválido</p>
        </div>

        <button type="submit" id="entrar">Entrar</button>
      </form>
    </div>

    <div class="admin-row">
      <span>¿Sos administrador?</span>
      <a class="admin-link" href="admin.html">Acceso aquí</a>
    </div>
  </div>

  <span class="version-tag" id="version-tag"></span>

<script>
  const APP_VERSION = 9;

  document.getElementById('version-tag').textContent = 'v' + APP_VERSION;

  const form = document.getElementById('form-entrada');
  const input = document.getElementById('codigo');
  const errorMsg = document.getElementById('error-msg');
  const CODIGO_REGEX = /^[A-Za-z]{2,3}$/;

  function mostrarError(mostrar){
    errorMsg.hidden = !mostrar;
    input.classList.toggle('invalid', mostrar);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const valor = input.value.trim();

    if(!CODIGO_REGEX.test(valor)){
      mostrarError(true);
      input.focus();
      return;
    }

    mostrarError(false);
    window.location.href = 'pos.html?p=' + valor.toUpperCase();
  });

  input.addEventListener('input', function(){
    if(!errorMsg.hidden){
      mostrarError(false);
    }
  });
</script>

</body>
</html>
