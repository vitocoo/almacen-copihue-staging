<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Copihue · Revista</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2e7d32; --vd:#1b5e20; --vdp:#0a3d0f; --vl:#e8f5e9;
  --rojo:#c62828; --rl:#ffebee; --morado:#6a1b9a; --navidad:#b71c1c;
  --gris:#546e7a; --bg:#f1f8f1; --borde:#c8e6c9; --texto:#1a2e1c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--texto);min-height:100dvh;padding-bottom:90px}
.hdr{background:linear-gradient(135deg,#7f0000,var(--navidad),var(--vd));padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.3);position:sticky;top:0;z-index:50}
.hdr-icon{font-size:1.5rem}
.hdr-t{color:#fff;font-size:.95rem;font-weight:900}
.hdr-s{color:rgba(255,255,255,.75);font-size:.62rem;letter-spacing:2px;text-transform:uppercase}
.ver{font-size:.6rem;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:2px 7px;margin-left:6px;font-weight:700;letter-spacing:0}
.btn-back{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:20px;padding:6px 13px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.ldg{text-align:center;padding:60px 20px;color:var(--gris)}
.spin{width:34px;height:34px;border:3px solid var(--vl);border-top-color:var(--verde);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{margin:12px;background:#fff;border-radius:18px;border:1px solid var(--borde);overflow:hidden;box-shadow:0 1px 6px rgba(46,125,50,.08)}
.card-t{background:linear-gradient(90deg,var(--vdp),var(--vd));color:#fff;padding:10px 16px;font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.card-t small{margin-left:auto;font-weight:700;letter-spacing:0;text-transform:none;opacity:.85}
.card-b{padding:12px 14px 14px}
.fila{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fila label{font-size:.78rem;font-weight:800;color:var(--gris);min-width:96px}
.fila input[type=text],.fila input[type=number]{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:.95rem;font-family:inherit}
.sw{display:flex;gap:6px}
.sw button{padding:9px 16px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;font-weight:900;font-family:inherit;cursor:pointer;color:var(--gris)}
.sw button.on.si{background:var(--verde);border-color:var(--vd);color:#fff}
.sw button.on.no{background:var(--rojo);border-color:var(--rojo);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border:1.5px solid var(--borde);border-radius:20px;background:#fff;font-size:.74rem;font-weight:800;cursor:pointer;color:var(--gris);font-family:inherit}
.chip.on{background:var(--verde);border-color:var(--vd);color:#fff}
.ayuda{font-size:.72rem;color:var(--gris);margin:-4px 0 10px}
.buscar{width:100%;padding:12px 14px;border:2px solid var(--verde);border-radius:14px;font-size:1rem;font-family:inherit;margin-bottom:8px}
.res{max-height:300px;overflow-y:auto;border-radius:12px}
.ri{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #eee}
.ri img,.it img{width:46px;height:46px;object-fit:contain;border-radius:8px;background:#fafafa;flex:none}
.ri .n,.it .n{flex:1;min-width:0;font-size:.8rem;font-weight:800;line-height:1.25}
.ri .p,.it .p{font-size:.72rem;color:var(--gris);font-weight:700}
.btn-mas{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:var(--verde);color:#fff;font-size:1.3rem;font-weight:900;cursor:pointer}
.btn-mas:disabled{background:#bdbdbd}
.it{border:1.5px solid var(--borde);border-radius:14px;padding:8px;margin-bottom:8px;background:#fff}
.it.malo{border-color:var(--rojo);background:var(--rl)}
.it-top{display:flex;align-items:center;gap:10px}
.it-drag{flex:none;width:30px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#9e9e9e;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
.it-drag:hover{background:#f1f1f1;color:#555}
.it.arrastrando{opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.25);border-color:var(--navidad);position:relative;z-index:5;transform:scale(1.02)}
body.arrastrando{user-select:none;-webkit-user-select:none;cursor:grabbing}
#lista.compacto .it>:not(.it-top){display:none}
#lista.compacto .it{margin-bottom:5px;padding:5px 8px}
#lista.compacto .it-acc{display:none}
.grp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.74rem;font-weight:900;color:var(--gris)}
.grp select{flex:1;min-width:0;padding:7px 9px;border:1.5px solid var(--borde);border-radius:10px;font-size:.84rem;font-family:inherit;background:#fff;color:#333}
.gr-cab{display:flex;align-items:center;gap:6px;margin:12px 0 6px;padding:7px 10px;border-radius:10px;background:linear-gradient(90deg,#fff3e0,#fff);border-left:4px solid var(--navidad);font-weight:900;font-size:.86rem}
.gr-cab span{flex:1;min-width:0}
.gr-cab small{font-weight:700;color:var(--gris);font-size:.7rem}
.gr-cab button{width:32px;height:30px;border-radius:8px;border:1.5px solid var(--borde);background:#fff;cursor:pointer;font-size:.9rem}
.gr-cab button:disabled,.it-acc button:disabled{opacity:.3}
.au-star{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;border:1.5px solid #ffb300;background:#fff8e1;font-size:.85rem;cursor:pointer;line-height:1;padding:0;z-index:2}
.au-star:hover{background:#ffb300}
/* v9 — cada producto destacado se distingue: franja de color arriba, borde, sombra y zona de configuración con fondo suave; se alternan rojo/verde */
#lista .it{border:2px solid #ef9a9a;background:#fff8f6;padding:0 0 10px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.08);margin-bottom:14px}
#lista .it>.it-top{background:linear-gradient(90deg,#ffebee,#fff3e0);border-bottom:2px solid #ef9a9a;padding:8px}
#lista .it>:not(.it-top){margin-left:10px;margin-right:10px}
#lista .it>input{width:calc(100% - 20px);box-sizing:border-box}
#lista .it.alt{border-color:#a5d6a7;background:#f5fbf5}
#lista .it.alt>.it-top{background:linear-gradient(90deg,#e8f5e9,#f1f8e9);border-bottom-color:#a5d6a7}
#lista .it.alt .it-num{background:#2e7d32}
#lista .it input,#lista .it select{background:#fff}
#lista .it:hover{box-shadow:0 5px 16px rgba(0,0,0,.14)}
#lista .it.malo{border-color:var(--rojo);background:var(--rl)}
#lista.compacto .it{padding:0;margin-bottom:6px}
#lista.compacto .it>.it-top{border-bottom:none}
@media (max-width:480px){.it-top{gap:6px}.it-drag{width:24px}.it-num{width:22px;height:22px;font-size:.72rem}.it-top img{width:34px;height:34px}.it-acc{gap:3px}.it-acc button{width:30px;height:32px;font-size:.9rem}}
.it-num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navidad);color:#fff;font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.it-acc{display:flex;gap:4px;flex:none}
.it-acc button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;font-size:1rem;cursor:pointer}
.it input{width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--borde);border-radius:10px;font-size:.88rem;font-family:inherit;color:var(--morado);font-style:italic}
.vig{background:var(--vl);color:var(--vd);font-weight:800;font-size:.8rem;border-radius:10px;padding:9px 12px;margin:2px 0 12px}
.vig.malo{background:var(--rl);color:var(--rojo)}
.fila input[type=date]{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;font-size:.95rem;font-family:inherit}
.prv{display:flex;align-items:center;gap:8px;margin-top:8px}
.prv span{font-size:.75rem;font-weight:900;color:var(--navidad);white-space:nowrap}
.prv input{flex:1;min-width:0;width:auto!important;margin:0!important;font-style:normal!important;color:var(--texto)!important;font-weight:800}
.prv input.mal{border-color:var(--rojo)!important;background:var(--rl)}
.prv small{font-size:.7rem;color:var(--gris);font-weight:700;white-space:nowrap}
.prv-err{font-size:.72rem;font-weight:800;margin-top:3px;min-height:.9em}
.vacio{text-align:center;color:var(--gris);font-size:.82rem;padding:14px}
.auto{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.auto div{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:6px;text-align:center;font-size:.64rem;font-weight:700;line-height:1.2}
.auto img{width:100%;height:60px;object-fit:contain}
.au{position:relative;cursor:pointer}
.au:active{transform:scale(.96)}
.au-x{position:absolute;top:3px;right:4px;font-size:.7rem;opacity:.55}
.oc-tit{margin:14px 0 6px;font-size:.74rem;font-weight:900;color:var(--rojo)}
.oc-tit small{font-weight:700;color:var(--gris)}
.oc{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px dashed #ef9a9a;border-radius:10px;margin-bottom:5px;background:#fff8f8}
.oc span{flex:1;min-width:0;font-size:.74rem;font-weight:700;color:#888;text-decoration:line-through}
.oc button{flex:none;border:none;background:var(--verde);color:#fff;border-radius:8px;padding:6px 10px;font-weight:800;font-size:.72rem;cursor:pointer;font-family:inherit}
.auto b{display:block;color:var(--rojo);font-size:.75rem}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.12);padding:10px 12px;display:flex;gap:8px;z-index:60}
.barra button,.barra a{flex:1;padding:14px 8px;border:none;border-radius:14px;font-weight:900;font-size:.95rem;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none}
.b-ver{background:#eceff1;color:#37474f}
.b-guardar{background:#9e9e9e;color:#fff}
.b-guardar.sucio{background:var(--verde)}
.msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:200;max-width:86vw;padding:16px 20px;border-radius:16px;color:#fff;font-weight:800;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none}
.msg.ok{background:var(--verde)} .msg.err{background:var(--rojo)}
.login{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
.login.open{display:flex}
.login-c{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px;text-align:center}
.login-c h3{color:var(--vd);margin-bottom:6px}
.login-c p{font-size:.8rem;color:var(--gris);margin-bottom:12px}
.login-c .chips{justify-content:center;margin-bottom:12px}
.login-c input{width:100%;padding:12px;border:2px solid var(--verde);border-radius:12px;font-size:1.3rem;text-align:center;letter-spacing:6px;font-family:inherit;margin-bottom:10px}
.login-c button.go{width:100%;padding:13px;border:none;border-radius:12px;background:var(--verde);color:#fff;font-weight:900;font-size:1rem;font-family:inherit;cursor:pointer}
.login-c .err{color:var(--rojo);font-size:.8rem;font-weight:800;min-height:1.2em;margin-bottom:6px}
/* v215 — distintivo de oferta configurable (forma · color · texto · movimiento) */
.rv-dist { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 900; line-height: 1; pointer-events: none; }
.rv-dist b { font-size: 1.35rem; letter-spacing: -.5px; } .rv-dist small { font-size: .58rem; letter-spacing: .5px; margin-top: 2px; }
.rv-dist.t-largo b { font-size: .82rem; letter-spacing: 0; }
.rv-dist.f-ESTALLIDO { width: 92px; height: 92px; clip-path: polygon(50% 0%, 57.76% 21.02%, 75% 6.7%, 71.21% 28.79%, 93.3% 25%, 78.98% 42.24%, 100% 50%, 78.98% 57.76%, 93.3% 75%, 71.21% 71.21%, 75% 93.3%, 57.76% 78.98%, 50% 100%, 42.24% 78.98%, 25% 93.3%, 28.79% 71.21%, 6.7% 75%, 21.02% 57.76%, 0% 50%, 21.02% 42.24%, 6.7% 25%, 28.79% 28.79%, 25% 6.7%, 42.24% 21.02%); }
.rv-dist.f-CIRCULO { width: 78px; height: 78px; border-radius: 50%; box-shadow: 0 4px 12px rgba(0,0,0,.3); border: 3px solid #fff; }
.rv-dist.f-CINTA { top: 18px; right: -34px; width: 150px; height: 34px; transform: rotate(40deg); flex-direction: row; gap: 5px; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.rv-dist.f-CINTA b { font-size: 1rem; } .rv-dist.f-CINTA small { margin: 0; }
.rv-dist.f-CINTA.t-largo { top: 22px; right: -46px; width: 190px; } .rv-dist.f-CINTA.t-largo b { font-size: .72rem; } .rv-dist.f-CINTA.t-largo small { font-size: .52rem; }
.rv-dist.f-ETIQUETA { min-width: 82px; height: 44px; padding: 0 12px 0 20px; flex-direction: row; gap: 5px; clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); border-radius: 0 10px 10px 0; }
.rv-dist.f-ETIQUETA b { font-size: 1.05rem; } .rv-dist.f-ETIQUETA small { margin: 0; }
.rv-dist.c-ROJO { background: linear-gradient(135deg, #ff6f00, #e53935); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.rv-dist.c-DORADO { background: linear-gradient(135deg, #fff176, #ffb300 55%, #ff8f00); color: #3e2723; }
.rv-dist.c-VERDE { background: linear-gradient(135deg, #43a047, #1b5e20); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.rv-dist.m-LATIDO { animation: rvLatido 2.4s ease-in-out infinite; }
.rv-dist.f-CINTA.m-LATIDO { animation: rvLatidoCinta 2.4s ease-in-out infinite; }
@keyframes rvLatido { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.14); } 90% { transform: scale(.97); } }
@keyframes rvLatidoCinta { 0%, 70%, 100% { transform: rotate(40deg) scale(1); } 80% { transform: rotate(40deg) scale(1.1); } 90% { transform: rotate(40deg) scale(.98); } }
@media (prefers-reduced-motion: reduce) { .rv-dist.m-LATIDO, .rv-dist.f-CINTA.m-LATIDO { animation: none; } }
.rv-pag .rv-foto { overflow: hidden; }

.dist-prev{position:relative;height:120px;border-radius:14px;background:linear-gradient(135deg,#fafafa,#e8f5e9);overflow:hidden;margin:6px 0 10px;border:1px solid var(--borde)}
.dist-prev .ph{position:absolute;left:14px;bottom:12px;font-size:.72rem;color:var(--gris);font-weight:700}
.dist-prev .ph b{display:block;color:var(--rojo);font-size:1.2rem}
.dist-prev .ph s{color:#9e9e9e}
.ops{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.txt-propio{width:100%;padding:9px 11px;border:1.5px solid var(--borde);border-radius:10px;font-size:.9rem;font-family:inherit;text-transform:uppercase;margin-bottom:6px}
.pct-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pct{border:1.5px solid #ffcdd2;background:#fff;border-radius:16px;padding:5px 9px;font-size:.72rem;font-weight:800;color:var(--navidad);cursor:pointer;font-family:inherit}
.pct b{color:#333;font-weight:800}
.pct.on{background:var(--navidad);color:#fff;border-color:var(--navidad)} .pct.on b{color:#fff}
.pct.mini{padding:3px 7px;font-size:.68rem;margin-top:3px}
.tema-prev{border-radius:14px;padding:14px 0 18px;margin:4px 0 10px;overflow:hidden}
.tp-banda{transform:skewY(-4deg);padding:14px 16px;margin:0 -6px;color:#fff}
.tp-banda>*{transform:skewY(4deg)}
.tp-tit{font:900 1.3rem/1 'Arial Narrow',sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.tp-banda s{font-weight:800;font-size:.8rem}
.tp-limpio{background:#fff;margin:0 14px;border-radius:12px;overflow:hidden;text-align:center}
.tp-limpio .tp-foto{background:#fafafa;height:54px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.tp-limpio .tp-nom{font-weight:800;font-size:.82rem;color:#1b1b1b;padding-top:6px}
.tp-limpio s{color:#9e9e9e;font-weight:700;font-size:.78rem}
.tp-limpio .tp-pl{font-weight:900;font-size:1.4rem;padding-bottom:8px}
.btn-reset{margin-top:10px;width:100%;border:1.5px dashed #bdbdbd;background:#fff;border-radius:10px;padding:9px;font-weight:800;font-size:.8rem;color:#555;cursor:pointer;font-family:inherit}
.tp-precio{font:900 2rem/1 sans-serif}
</style>
</head>
<body>
<div style="background:#ff9800;color:#000;text-align:center;font-weight:900;font-size:.75rem;padding:4px">🧪 STAGING — datos de prueba</div>
<div class="hdr">
  <div class="hdr-icon">🎄</div>
  <div><div class="hdr-t">Copihue <span class="ver" id="verBadge"></span></div><div class="hdr-s">Revista · configuración</div></div>
  <button type="button" class="btn-back" onclick="volver()">← Volver</button>
</div>

<div id="app"><div class="ldg"><div class="spin"></div>Cargando la revista…</div></div>

<div class="barra">
  <a class="b-ver" id="bVer" href="index.html#revista" target="_blank" rel="noopener">👁 Ver revista</a>
  <button type="button" class="b-guardar" id="bGuardar" onclick="guardar()">💾 Guardar</button>
</div>
<div class="msg" id="msg"></div>
<div class="login" id="login">
  <div class="login-c">
    <h3>🔐 Clave del POS</h3>
    <p>Para guardar cambios en la revista, entrá con tu clave.</p>
    <div class="chips" id="lgNombres"></div>
    <input type="password" id="lgPin" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <div class="err" id="lgErr"></div>
    <button type="button" class="go" onclick="loginEntrar()">Entrar</button>
    <button type="button" class="chip" style="margin-top:10px" onclick="loginCerrar()">Cancelar</button>
  </div>
</div>

<script>
const APP_VERSION = 12;
const API_URL = 'https://script.google.com/macros/s/AKfycbzQccLKYVVhdCGzX8_SKd59rcifTTm_Ciuu0MPDVNBNEtDhG0LOB7WylhYVMSFAypB9pg/exec';
const POS_URL = 'seba21-staging.html';
const SEG_SESION_KEY = 'copihue_sesion';   // la misma sesión que guarda el POS (seba21)
document.title = '🎄 Copihue · Revista v' + APP_VERSION + ' (STAGING)';
document.getElementById('verBadge').textContent = 'v' + APP_VERSION;

let CFG = null, DEST = [], CATALOGO = [], CATS_INV = [], SUCIO = false, lgNombre = '', despuesLogin = null;
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt$ = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
const slug = n => String(n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
const foto = n => 'imagenes-productos/' + slug(n) + '.jpg';
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

function aviso(txt, ok) { const m = $('msg'); m.textContent = txt; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(() => m.style.display = 'none', ok ? 1800 : 3800); }
function marcarSucio(v) { SUCIO = v; $('bGuardar').classList.toggle('sucio', v); $('bGuardar').textContent = v ? '💾 Guardar cambios' : '💾 Guardado'; }

// ---- salir siempre con confirmación si hay cambios sin guardar ----
function volver() { if (SUCIO && !confirm('Tenés cambios sin guardar. ¿Salir igual?')) return; SUCIO = false; location.href = POS_URL; }
window.addEventListener('beforeunload', e => { if (SUCIO) { e.preventDefault(); e.returnValue = ''; } });
history.pushState({ rv: 1 }, '');
window.addEventListener('popstate', () => { if (SUCIO && !confirm('Tenés cambios sin guardar. ¿Salir igual?')) { history.pushState({ rv: 1 }, ''); return; } SUCIO = false; location.href = POS_URL; });

async function cargar() {
    try {
        const [r1, r2] = await Promise.all([
            fetch(API_URL + '?action=revista&t=' + Date.now(), { redirect: 'follow' }).then(r => r.json()),

// v8 — arrastrar con la manija ☰ (dedo o mouse). Al soltar dentro de un grupo, pasa a ese grupo.

    const top0 = el.getBoundingClientRect().top;

function ponerPct(i, p) {

  // 2) recargar de verdad (también la app instalada): memoria vieja afuera + página nueva desde internet
  function actualizar() {
    cartel('⏳ Actualizando…', '#1565c0');
    var tareas = [];
    try { if ('caches' in window) tareas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    try { if (navigator.serviceWorker) tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.update().catch(function () {}); })); })); } catch (e) {}
    try { tareas.push(fetch(location.pathname + location.search, { cache: 'reload' }).catch(function () {})); } catch (e) {}
    Promise.all(tareas).catch(function () {}).then(function () { location.reload(); });
  }
  window.copihueActualizar = actualizar;
  // 3) ¿hay una versión más nueva publicada? (liviano: solo la misma página, no la planilla)
  function revisar() {
    if (document.visibilityState === 'hidden' || !navigator.onLine) return;
    var ahora = Date.now(); if (ahora - ult < 60000) return; ult = ahora;
    fetch(location.pathname + '?avchk=' + ahora, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      var m = /\/\*AV\*\/var AV_PAG='([^']*)',AV_VER='([^']*)'/.exec(t || '');
      if (m && m[1] === AV_PAG && m[2] !== AV_VER) cartel('🔄 Hay versión nueva (v' + m[2] + ') — tocá para actualizar', '#e65100', actualizar);
    }).catch(function () {});
  }
  setTimeout(revisar, 20000);
  setInterval(revisar, 10 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') revisar(); });
})();
</script>
